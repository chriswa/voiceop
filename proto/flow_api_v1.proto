syntax = "proto3";

package flow_api.v1;

import "google/protobuf/duration.proto";

// Reverse-engineered from the Wispr Flow app bundle (protobuf-ts generated
// classes in .webpack/main/index.js) — see CLAUDE.md "read the app, don't probe".
// Complete: 35 messages, service, enums (incl. AudioEncoding.OPUS=2,
// Environment.PRODUCTION=1). Only `Language` members are unresolved (placeholder;
// we never send a meaningful Language). This is the PRIMARY (formatted) parity
// path — see DESIGN.md Milestone C.

service TranscriptionService {
  rpc Transcribe(Request) returns (Response);
  rpc TranscribeStream(stream Request) returns (stream Response);
}

message Version {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message Client {
  string name = 1;
  Platform platform = 2;
  Version version = 3;
}

message App {
  string name = 1;
  string bundle_id = 2;
  string url = 3;
  AppType type = 4;
}

message Textbox {
  optional string contents = 1;
  optional string before_text = 2;
  optional string selected_text = 3;
  optional string after_text = 4;
}

message DynamicVocabulary {
  repeated string screen_content_ax = 1;
  repeated string screen_content_ocr = 2;
  repeated string variable_names = 3;
  repeated string file_names = 4;
}

message ChatMessage {
  ChatRole role = 1;
  string content = 2;
  string sender_id = 3;
}

message Conversation {
  string id = 1;
  repeated string participants = 2;
  repeated ChatMessage messages = 3;
}

message Context {
  App app = 1;
  Textbox textbox = 2;
  DynamicVocabulary vocabulary = 3;
  string user_identifier = 4;
  string content_text = 5;
  string content_html = 6;
  repeated App session_dictation_apps = 7;
  bytes screenshot = 8;
  Conversation conversation = 9;
}

message Metadata {
  string user_id = 1;
  string session_id = 2;
  string request_id = 3;
  AudioEncoding audio_encoding = 4;
  Environment environment = 5;
  Client client = 6;
  bool debug = 7;
  string referral_code = 8;
  bool always_wait_scribe = 9;
}

message GeneralWritingStyle {
  WritingStyle other = 1;
  WritingStyle personal = 2;
  WritingStyle work = 3;
  WritingStyle email = 4;
}

message TaggingStyle {
  optional bool slack = 1;
}

message SignatureStyle {
  FlowSignaturePrefix flow_signature_prefix = 1;
  optional bool flow_signature_hyperlink = 2;
  optional bool sign_emails = 3;
}

message StyleConfig {
  GeneralWritingStyle general_style = 1;
  WritingStyle override_style = 2;
  TaggingStyle tagging = 3;
  SignatureStyle signature = 4;
  EditingStrength editing_strength = 5;
}

message AudioPackets {
  repeated bytes items = 1;
}

message AudioFile {
  bytes data = 1;
}

message Payload {
  oneof audio {
    AudioPackets audio_packets = 1;
    AudioFile audio_file = 2;
  }
}

message Text {
  string content = 1;
  uint32 num_tokens = 2;
  repeated Language languages = 3;
}

message Progress {
  google.protobuf.Duration transcriber = 1;
  bool transcriber_finished = 2;
  google.protobuf.Duration formatter = 3;
  bool formatter_finished = 4;
  bool post_processing_finished = 5;
}

message UserActions {
  bool check_mic = 1;
  Language check_language = 2;
}

message WordAlignment {
  string word = 1;
  float score = 2;
}

message CandidateBeam {
  Text text = 1;
  float score = 2;
  Confidence confidence = 3;
  Origin origin = 4;
  optional float alignment_score = 5;
  optional string original_text = 6;
  repeated WordAlignment word_alignments = 7;
}

message State {
  Progress progress = 1;
  Text raw_text = 2;
  Text formatted_text = 3;
  Confidence confidence = 4;
  UserActions user_actions = 5;
  repeated CandidateBeam candidate_beams = 6;
  optional float audio_snr = 7;
  optional float audio_volume = 8;
  optional float mean_alignment_score = 9;
}

message User {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
}

message StaticVocabulary {
  repeated string dictionary_personal = 1;
  repeated string dictionary_team = 2;
  repeated string dictionary_personal_starred = 3;
  repeated string dictionary_team_starred = 4;
}

message Replacements {
  map<string, string> replacements_personal = 1;
  map<string, string> replacements_team = 2;
  map<string, string> snippets_personal = 3;
  map<string, string> snippets_team = 4;
}

message Preferences {
  User user = 1;
  repeated Language language = 2;
  StaticVocabulary vocabulary = 3;
  Replacements replacements = 4;
  StyleConfig style_config = 5;
}

message Init {
  Metadata metadata = 1;
  Preferences preferences = 2;
  State state = 3;
}

message SkipAhead {
  google.protobuf.Duration position = 1;
}

message Request {
  Init init = 1;
  Context context = 2;
  Payload payload = 3;
  Commit commit = 4;
}

message ResponseTime {
  google.protobuf.Duration transcribe = 1;
  google.protobuf.Duration transcribe_overhead = 2;
  google.protobuf.Duration format = 3;
  google.protobuf.Duration format_overhead = 4;
  google.protobuf.Duration post_process = 5;
  google.protobuf.Duration total = 6;
  google.protobuf.Duration external_asr_time = 7;
  google.protobuf.Duration external_llm_time = 8;
  google.protobuf.Duration generate_queue_duration = 9;
  google.protobuf.Duration generate_work_duration = 10;
}

message Transcription {
  string html = 1;
  string plaintext = 2;
  uint32 num_tokens = 3;
  repeated Language languages = 4;
  float confidence = 5;
  bool language_detection_low_confidence = 6;
}

message TranscriptionStats {
  uint32 word_deletions = 1;
  uint32 context_word_count = 2;
  uint32 word_substitutions = 3;
}

message Result {
  Transcription output = 1;
  google.protobuf.Duration audio_duration = 2;
  ResponseTime response_time = 3;
  SignatureStatus signature_status = 4;
  ResultStatus status = 5;
  TranscriptionStats stats = 6;
  string transcript_origin = 7;
  string server_address = 8;
}

message Heartbeat {
  float audio_received_seconds = 1;
  bool commit_ack = 2;
}

message Response {
  Result result = 1;
  State state = 2;
  repeated State all_states = 3;
  Heartbeat heartbeat = 4;
}

enum AppType {
  APP_TYPE_UNSPECIFIED = 0;
  APP_TYPE_OTHER = 1;
  APP_TYPE_BROWSER = 2;
  APP_TYPE_PERSONAL_MESSAGING = 3;
  APP_TYPE_WORK_MESSAGING = 4;
  APP_TYPE_EMAIL = 5;
  APP_TYPE_CHATBOT = 6;
  APP_TYPE_DEVELOPER = 7;
}

enum AudioEncoding {
  AUDIO_ENCODING_UNSPECIFIED = 0;
  AUDIO_ENCODING_WAV = 1;
  AUDIO_ENCODING_OPUS = 2;
}

enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_USER = 1;
  CHAT_ROLE_HUMAN = 2;
  CHAT_ROLE_ASSISTANT = 3;
}

enum Commit {
  COMMIT_UNSPECIFIED = 0;
  COMMIT_TRUE = 1;
  COMMIT_FALSE = 2;
}

enum Confidence {
  CONFIDENCE_UNSPECIFIED = 0;
  CONFIDENCE_NONE = 1;
  CONFIDENCE_LOW = 2;
  CONFIDENCE_MEDIUM = 3;
  CONFIDENCE_HIGH = 4;
}

enum EditingStrength {
  EDITINGSTRENGTH_UNSPECIFIED = 0;   // TODO: members not resolved from bundle
}

enum Environment {
  ENVIRONMENT_UNSPECIFIED = 0;
  ENVIRONMENT_PRODUCTION = 1;
  ENVIRONMENT_STAGING = 2;
  ENVIRONMENT_DEVELOPMENT = 3;
  ENVIRONMENT_TEST = 4;
}

enum FlowSignaturePrefix {
  FLOW_SIGNATURE_PREFIX_UNSPECIFIED = 0;
  FLOW_SIGNATURE_PREFIX_SPOKEN = 1;
  FLOW_SIGNATURE_PREFIX_WRITTEN = 2;
}

enum Language {
  LANGUAGE_UNSPECIFIED = 0;   // TODO: members not resolved from bundle
}

enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  ORIGIN_MIXTURE = 1;
  ORIGIN_WHISPER = 2;
  ORIGIN_SCRIBE = 3;
  ORIGIN_VOXTRAL = 4;
  ORIGIN_QWEN = 5;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_MACOS = 1;
  PLATFORM_WIN32 = 2;
  PLATFORM_IOS = 3;
  PLATFORM_ANDROID = 4;
  PLATFORM_WEB = 5;
  PLATFORM_API = 6;
}

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_STATUS_FORMATTED = 1;
  RESULT_STATUS_ERROR = 2;
  RESULT_STATUS_RAW_TRANSCRIPT = 3;
}

enum SignatureStatus {
  SIGNATURE_STATUS_UNSPECIFIED = 0;
  SIGNATURE_STATUS_ELIGIBLE = 1;
  SIGNATURE_STATUS_ADDED = 2;
}

enum WritingStyle {
  WRITING_STYLE_UNSPECIFIED = 0;
  WRITING_STYLE_FORMAL = 1;
  WRITING_STYLE_CASUAL = 2;
  WRITING_STYLE_VERY_CASUAL = 3;
  WRITING_STYLE_EXCITED = 4;
  WRITING_STYLE_GENZ = 5;
}
